function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function searchKnowledge(){
  const q=document.getElementById("searchBox").value.trim().toLowerCase();
  const box=document.getElementById("searchResults");
  if(!q){box.innerHTML='<span style="color:#756e63">输入关键词，例如：乾、坎、子、五行、妻财、初爻……</span>';return}
  const rows=knowledge.filter(x=>x.join(" ").toLowerCase().includes(q));
  if(!rows.length){box.innerHTML='<span style="color:#a33">没有找到相关内容。可以试试“乾”“五行”“纳支”“妻财”等关键词。</span>';return}

    <div style="padding:11px 4px;border-top:1px solid #eee5d8">
      <b>${esc(x[0])}</b>
      <span style="margin-left:8px;font-size:12px;padding:3px 7px;border-radius:5px;background:#eee7d8">${esc(x[1])}</span>

  if(!q && searchType==="全部"){box.innerHTML='<span class="muted">输入关键词即可搜索；也可以先选择分类。</span>';return}
  if(!rows.length){box.innerHTML='<span style="color:#a33">没有找到相关内容。</span>';return}
  box.innerHTML=rows.slice(0,50).map(x=>`
    <div class="result">
      <b>${esc(x[0])}</b><span class="pill">${esc(x[1])}</span>
      <div style="margin-top:5px;line-height:1.65">${esc(x[2])}</div>
      ${x[3]?`<div class="muted">${esc(x[3])} · ${esc(x[4])} · ${esc(x[5])}</div>`:""}
    </div>`).join("");
}
function saveCurrent(){
  const item={time:new Date().toLocaleString(),bits:[...bits],moving:[...moving]};
  const arr=JSON.parse(localStorage.getItem(historyKey)||"[]");
  arr.unshift(item); localStorage.setItem(historyKey,JSON.stringify(arr.slice(0,20)));
  alert("排盘已保存到本机浏览器。");
}
function exportText(){
  const up=namesFor(bits)[0],low=namesFor(bits)[1],ch=bits.map((b,i)=>moving[i]?1-b:b);
  const [cup,clow]=namesFor(ch);
  const lines=bits.map((b,i)=>`${pos[i]} ${b?"阳":"阴"} 纳支${branch[i]} ${elem[branch[i]]} ${relationFor(branch[i])} ${i===2?"世":i===5?"应":""} ${moving[i]?"动爻":""}`).join("\n");
  const text=`六爻周易排盘\n时间：${new Date().toLocaleString()}\n本卦：${guaData[up+low]?.[0]||up+low}\n变卦：${guaData[cup+clow]?.[0]||cup+clow}\n\n${lines}`;
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="六爻排盘.txt";a.click();URL.revokeObjectURL(a.href);
}

</script>
